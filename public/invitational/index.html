<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <title>Раздел обновляется | Indoor Golf Moscow</title>
  <meta
    name="description"
    content="Программа, календарь и площадка события сейчас уточняются. Подтверждённая информация появится позже."
  >
  <link rel="canonical" href="https://indoor-golf.ru/invitational/">
  <meta property="og:title" content="Раздел обновляется | Indoor Golf Moscow">
  <meta
    property="og:description"
    content="Программа, календарь и площадка события сейчас уточняются."
  >
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://indoor-golf.ru/invitational/">
  <style>
    @font-face {
      font-family: Inter;
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('/fonts/inter-cyrillic.woff2') format('woff2');
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }

    @font-face {
      font-family: Inter;
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('/fonts/inter-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
        U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
        U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
      color-scheme: dark;
      --background: #090909;
      --surface: #121212;
      --line: rgba(255, 255, 255, 0.13);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.64);
      --orange: #e35b27;
      --orange-light: #f0713d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-width: 320px;
      min-height: 100svh;
      background:
        radial-gradient(circle at 82% 15%, rgba(227, 91, 39, 0.16), transparent 34rem),
        var(--background);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 28px 20px;
    }

    .panel {
      width: min(760px, 100%);
      border-block: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.045), rgba(18, 18, 18, 0.88));
      padding: clamp(32px, 7vw, 72px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--orange-light);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .brand::before {
      width: 32px;
      height: 1px;
      background: var(--orange);
      content: "";
    }

    h1 {
      max-width: 620px;
      margin-top: 22px;
      font-size: clamp(38px, 8vw, 78px);
      font-weight: 400;
      letter-spacing: -0.055em;
      line-height: 0.98;
    }

    p {
      max-width: 590px;
      margin-top: 26px;
      color: var(--muted);
      font-size: clamp(16px, 2.2vw, 19px);
      line-height: 1.65;
    }

    .backSite {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      margin-top: 34px;
      border: 1px solid var(--orange);
      background: var(--orange);
      color: #111111;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 20px;
      text-decoration: none;
      transition: background 180ms ease, border-color 180ms ease;
    }

    .backSite:hover,
    .backSite:focus-visible {
      border-color: var(--orange-light);
      background: var(--orange-light);
      outline: 2px solid transparent;
    }

    @media (max-width: 520px) {
      .panel {
        padding-inline: 24px;
      }

      .backSite {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel" aria-labelledby="page-title">
      <div class="brand">Indoor Golf Moscow</div>
      <h1 id="page-title">Раздел обновляется</h1>
      <p>
        Мы уточняем программу, календарь и площадку события. Подтверждённая информация
        появится здесь позже.
      </p>
      <a
        class="backSite"
        href="/"
        aria-label="Вернуться на основной сайт Indoor Golf Moscow"
      >
        Вернуться на основной сайт
      </a>
    </section>
  </main>
</body>
</html>
